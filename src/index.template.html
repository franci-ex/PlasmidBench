<title>PlasmidBench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>{{styles.css}}</style>

<div class="app">
  <header class="topbar">
    <div class="brand" title="PlasmidBench">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"/>
        <path d="M12 3.5v3M20.5 12h-3M12 20.5v-3M3.5 12h3"/>
        <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
      </svg>
      <b>PlasmidBench</b>
    </div>

    <div class="rec-head">
      <input class="rec-name" id="recName" aria-label="Construct name" spellcheck="false" autocomplete="off">
      <div class="rec-meta" id="recMeta"></div>
    </div>

    <div class="topbar-actions">
      <div class="panel-toggles">
        <button class="btn icon ghost" id="btnRail" title="Library and enzymes" aria-label="Toggle library panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="btn icon ghost" id="btnInsp" title="Inspector" aria-label="Toggle inspector">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8h.01M11 12h1v4h1"/><circle cx="12" cy="12" r="9"/></svg>
        </button>
      </div>
      <button class="btn sm ghost" id="btnFind" title="Search the whole library  (/)" aria-label="Search the library">⌕<span class="btxt"> Find</span></button>
      <button class="btn sm ghost" id="btnUndo" disabled title="Undo (Ctrl/⌘ Z)" aria-label="Undo">↶<span class="btxt"> Undo</span></button>
      <button class="btn sm ghost" id="btnRedo" disabled title="Redo (Ctrl/⌘ Shift Z)" aria-label="Redo">↷<span class="btxt"> Redo</span></button>
      <button class="btn sm" id="btnImport">Import</button>
      <button class="btn sm" id="btnExport">Export</button>
      <button class="btn sm primary" id="btnTools">Tools</button>
      <button class="btn icon ghost" id="btnTheme" title="Switch light / dark" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7 4.9 19.1M19.1 4.9l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="rail" id="rail">
      <section class="rail-sec">
        <h2>Library <span class="n" id="libCount"></span></h2>
        <div class="lib-list" id="libList"></div>
        <div class="row" style="gap:5px;margin:0">
          <button class="btn sm" id="btnNew" style="flex:1 1 auto">New</button>
          <button class="btn sm" id="btnDup" style="flex:1 1 auto">Duplicate</button>
        </div>
        <div class="hint" id="storeState"></div>
      </section>

      <section class="rail-sec">
        <h2>Enzymes <span class="n" id="enzCount"></span></h2>
        <input class="enz-search" id="enzSearch" placeholder="filter by name or site" spellcheck="false" autocomplete="off">
        <div class="chipbar" id="enzChips">
          <button class="chip on" data-eset="common">Common</button>
          <button class="chip" data-eset="unique">Unique only</button>
          <button class="chip" data-eset="noncut">Non-cutters</button>
          <button class="chip" data-eset="iis">Type IIS</button>
          <button class="chip" data-eset="blunt">Blunt</button>
          <button class="chip" data-eset="all">All</button>
        </div>
        <div class="enz-list" id="enzList"></div>
        <div class="row" style="gap:5px;margin-top:8px">
          <button class="btn sm" id="btnEnzNone" style="flex:1 1 auto">Clear</button>
          <button class="btn sm" id="btnEnzCustom" style="flex:1 1 auto">Add custom</button>
        </div>
      </section>
    </aside>

    <main class="canvas">
      <nav class="viewtabs" id="viewTabs" role="tablist"></nav>
      <div class="viewport" id="viewport">
        <section class="view flush on" data-view="map" id="view-map"></section>
        <section class="view flush" data-view="seq" id="view-seq"></section>
        <section class="view" data-view="features" id="view-features"></section>
        <section class="view" data-view="enzymes" id="view-enzymes"></section>
        <section class="view" data-view="orfs" id="view-orfs"></section>
        <section class="view" data-view="primers" id="view-primers"></section>
        <section class="view" data-view="gel" id="view-gel"></section>
        <section class="view" data-view="verify" id="view-verify"></section>
        <section class="view" data-view="align" id="view-align"></section>
        <section class="view" data-view="history" id="view-history"></section>
      </div>
    </main>

    <aside class="inspector" id="inspector"></aside>
  </div>
</div>

<div class="modal-root" id="modalRoot" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" hidden multiple
       accept=".dna,.gb,.gbk,.genbank,.gbff,.gbf,.ape,.fa,.fasta,.fas,.fna,.ffn,.frn,.seq,.txt,.embl,.emb,.dat,.gff,.gff3,.ab1,.abi,.json,.xml">

<script>{{js/01-engine.js}}</script>
<script>{{js/02-cloning.js}}</script>
<script>{{js/03-primer-stock-engine.js}}</script>
<script>{{js/04-expression-engine.js}}</script>
<script>{{js/05-formats-extra.js}}</script>
<script>{{js/06-alignment-figures.js}}</script>
<script>{{js/07-read-interpretation.js}}</script>
<script>{{js/08-app-core.js}}</script>
<script>{{js/09-xlsx-writer.js}}</script>
<script>{{js/10-app-views.js}}</script>
<script>{{js/11-app-map.js}}</script>
<script>{{js/12-app-primers-gel-verify.js}}</script>
<script>{{js/13-app-tools.js}}</script>
<script>{{js/14-primer-stock-ui.js}}</script>
<script>{{js/15-expression-ui.js}}</script>
<script>{{js/16-app-main.js}}</script>
