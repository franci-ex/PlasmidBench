# A tagged release attaches the built file.
name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the HTML
        run: node build.js

      - name: Name it after the tag and generate notes
        run: |
          V="${GITHUB_REF_NAME}"
          
          # Find the built file whether it's in root or dist/
          if [ -f "dist/PlasmidBench.html" ]; then
            cp dist/PlasmidBench.html "PlasmidBench-${V}.html"
          elif [ -f "plasmidbench.html" ]; then
            cp plasmidbench.html "PlasmidBench-${V}.html"
          else
            # Fallback: find the first HTML file in the directory
            FILE=$(find . -name "*.html" -not -path "*/node_modules/*" | head -n 1)
            cp "$FILE" "PlasmidBench-${V}.html"
          fi
          
          # Generate the release notes
          {
            echo "## PlasmidBench ${V}"
            echo
            echo "One file. Download it and open it in a browser — no installation, no server, offline."
            echo
            echo "### Before you rely on it"
            echo "Run \`./validate-all.sh\` from a clone of this tag to see the full test results."
            echo
            echo "### Terms"
            echo "MIT for the code. Data tables from REBASE, NCBI, Kazusa, IDT (see NOTICE.md)."
          } > NOTES.md

      - name: Create Release and Upload HTML
        uses: softprops/action-gh-release@v2
        with:
          files: PlasmidBench-*.html
          body_path: NOTES.md
